site_name: Skills MCP Server
site_description: MCP server implementing the Agent Skills specification
site_url: https://stacklok.github.io/skills-mcp
repo_url: https://github.com/stacklok/skills-mcp
repo_name: stacklok/skills-mcp

theme:
  name: material
  features:
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture/mcp-server-design.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stacklok/skills-mcp
