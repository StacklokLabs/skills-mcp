[project]
name = "skills-mcp"
version = "0.1.0"
description = "MCP server implementing the Agent Skills specification"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Stacklok" }]
keywords = ["mcp", "agent-skills", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-frontmatter>=1.1",
    "uvicorn>=0.30",
    "anyio>=4.0",
    "oras>=0.2.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
]
tokens = [
    "tiktoken>=0.7",
]

[project.scripts]
skills-mcp = "skills_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/stacklok/skills-mcp"
Documentation = "https://stacklok.github.io/skills-mcp"
Repository = "https://github.com/stacklok/skills-mcp"
Issues = "https://github.com/stacklok/skills-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["frontmatter.*", "mcp.*", "tiktoken", "tiktoken.*", "uvicorn", "uvicorn.*", "oras", "oras.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/skills_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
