name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write  # For cosign signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stackloklabs/skills-mcp

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign container image
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          while IFS= read -r tag; do
            images+="${tag}@${DIGEST} "
          done <<< "$TAGS"
          cosign sign --yes ${images}

      - name: Generate release notes
        id: release-notes
        run: |
          echo "## Docker Images" >> notes.md
          echo "" >> notes.md
          echo "Pull the image:" >> notes.md
          echo "\`\`\`bash" >> notes.md
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> notes.md
          echo "\`\`\`" >> notes.md
          echo "" >> notes.md
          echo "### Available Tags" >> notes.md
          echo "" >> notes.md
          while IFS= read -r tag; do
            echo "- \`${tag}\`" >> notes.md
          done <<< "${{ steps.meta.outputs.tags }}"
          echo "" >> notes.md
          echo "### Verification" >> notes.md
          echo "" >> notes.md
          echo "Images are signed with cosign. Verify with:" >> notes.md
          echo "\`\`\`bash" >> notes.md
          echo "cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \\\\" >> notes.md
          echo "  --certificate-identity-regexp='https://github.com/StacklokLabs/skills-mcp/.*' \\\\" >> notes.md
          echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com'" >> notes.md
          echo "\`\`\`" >> notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          append_body: true
          body_path: notes.md
